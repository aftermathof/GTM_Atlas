# Run from repository root: docker compose -f infra/compose.production.yaml up -d --build
services:
  api:
    build: {context: .., dockerfile: infra/Dockerfile.api}
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATA_DIR: /data
      AUTH_MODE: supabase
      STORAGE_MODE: supabase
      RENDER_ENABLED: "false"
    # Apply supabase/schema.sql before startup; do not run Alembic initial creation.
    command: ["uvicorn", "services.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - private-data:/data
      - render-artifacts:/data/artifacts
      - render-queue:/data/render-queue
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
  renderer:
    build: {context: .., dockerfile: infra/Dockerfile.renderer}
    restart: unless-stopped
    network_mode: none
    read_only: true
    user: "10001:10001"
    volumes:
      - render-artifacts:/data/artifacts
      - render-queue:/data/render-queue
    tmpfs: ["/tmp:rw,noexec,nosuid,size=128m,uid=10001"]
    mem_limit: 768m
    cpus: 1
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  private-data:
  render-artifacts:
  render-queue:
